<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basilisk</title>
    <link rel="icon" type="/image/ico" href="../../favicon.ico">
    <link rel="stylesheet" href="../../css/normalize.css">
    <link rel="stylesheet" href="../../css/font-awesome.css">
    <link rel="stylesheet" href="../../css/site.css">
    <link rel="stylesheet" href="../../css/authorization.css">
    <script src="../../js/jquery-3.6.0.js"></script>
    <script src="../../js/site.js" defer></script>
</head>
<body class="authentication-body">
  <div class="authentication-wrapper">
    <header class="company-logo">
      <img src="../../image/logo.png" alt="Basilisk">
      <h1>
        Trade of <span class="bold">basilisk</span>
      </h1>
    </header>
    <main>
        <form class="upsert-form" method="post" action="/account/changePassword">
            <table>
                <tbody>
                <tr>
                    <td>
                        <label>Username</label>
                    </td>
                    <td>
                        <span>Username Value</span>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>Old Password</label>
                    </td>
                    <td>
                        <input type="password">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>New Password</label>
                    </td>
                    <td>
                        <input type="password">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>New Password Confirmation</label>
                    </td>
                    <td>
                        <input type="password">
                    </td>
                </tr>
                </tbody>
            </table>
            <button type="submit">Change Password</button>
        </form>
    </main>
  </div>
</body>
</html>
