
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basilisk</title>
    <link rel="icon" type="/image/ico" href="../../favicon.ico">
    <link rel="stylesheet" href="../../css/normalize.css">
    <link rel="stylesheet" href="../../css/font-awesome.css">
    <link rel="stylesheet" href="../../css/site.css">
    <link rel="stylesheet" href="../../css/authorization.css">
    <script src="../../js/jquery-3.6.0.js"></script>
    <script src="../../js/site.js" defer></script>
</head>
<body class="authentication-body">
  <div class="authentication-wrapper">
    <header class="company-logo">
      <img src="../../image/logo.png" alt="Basilisk">
      <h1>
        Trade of <span class="bold">basilisk</span>
      </h1>
    </header>
    <main>
        <h1>Sign Up</h1>
        <form method="post" action="/account/register">
    
            <div class="field-validation-error"></div>
    
            <input type="text" placeholder="username">
            <input type="password" placeholder="password">
    
            <input type="password" placeholder="confirm password">
            <select>
                <option value="role1">Role 1</option>
                <option value="role2">Role 2</option>
            </select>
            <button type="submit">sign up</button>
        </form>
        <div class="link-container">
            <a href="/account/loginForm">Click here to login</a>
        </div>
    </main>
    
  </div>
</body>
</html>
