<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basilisk</title>
    <link rel="icon" type="/image/ico" href="../../favicon.ico">
    <link rel="stylesheet" href="../../css/normalize.css">
    <link rel="stylesheet" href="../../css/font-awesome.css">
    <link rel="stylesheet" href="../../css/site.css">
    <link rel="stylesheet" href="../../css/authorization.css">
    <script src="../../js/jquery-3.6.0.js"></script>
    <script src="../../js/site.js" defer></script>
</head>
<body class="authentication-body">
  <div class="authentication-wrapper">
    <header class="company-logo">
      <img src="../../image/logo.png" alt="Basilisk">
      <h1>
        Trade of <span class="bold">basilisk</span>
      </h1>
    </header>
    <main>
        <h1>Sign In</h1>
        <form method="post" action="/authenticating">
            <input type="text" name="username" placeholder="username" autocomplete="off">
            <input type="password" name="password" placeholder="password">
            <div class="remember-me-container">
                <input type="checkbox" name="remember-me" id="remember-me">
                <label for="remember-me">Remember Me</label>
            </div>
            <button type="submit">sign in</button>
        </form>
        <div class="link-container">
            <a href="/account/registerForm">Click here to register</a>
        </div>
    </main>
  </div>
</body>
</html>
